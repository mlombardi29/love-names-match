<script>
/* ============================================================
   FREE AGENT — single-file demo app
   ============================================================ */

// ------------------------------------------------------------
// Constants
// ------------------------------------------------------------
const SPORTS = [
  { id: 'hockey',     name: 'Hockey',          emoji: '🏒', formats: ['5v5', '4v4', '3v3'] },
  { id: 'soccer',     name: 'Soccer',          emoji: '⚽', formats: ['11v11', '7v7', '5v5'] },
  { id: 'basketball', name: 'Basketball',      emoji: '🏀', formats: ['5v5', '3v3'] },
  { id: 'vball_in',   name: 'Volleyball (Indoor)', emoji: '🏐', formats: ['6v6', '4v4'] },
  { id: 'vball_bch',  name: 'Volleyball (Beach)',  emoji: '🏖️', formats: ['2v2', '4v4'] },
  { id: 'ultimate',   name: 'Ultimate',        emoji: '🥏', formats: ['7v7', '4v4'] },
];
const SPORT_MAP = Object.fromEntries(SPORTS.map(s => [s.id, s]));
const GENDERS = [
  { id: 'open', name: 'Open / Any' },
  { id: 'coed', name: 'Coed' },
  { id: 'men', name: "Men's" },
  { id: 'women', name: "Women's" },

// ------------------------------------------------------------
// State + storage
// ------------------------------------------------------------
const LS_KEY = 'free-agent.v1';
const state = {
  currentUserId: 'u_alex',
  view: 'player',          // 'player' | 'manager'
  screen: 'discover',      // dynamic
  params: {},              // screen-level params (e.g. requestId)
  filterSport: 'all',
  sort: 'match',
  draftRequest: null,
  draftRating: null,
  data: { users: [], requests: [], messages: [], ratings: [] },
};

function saveData() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(state.data));
  } catch (e) { console.warn('save failed', e); }
}
function loadData() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}

// ------------------------------------------------------------
// Helpers
// ------------------------------------------------------------
const $  = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];

const uid = (p='id') => `${p}_${Math.random().toString(36).slice(2, 9)}`;
const now = () => new Date();

function escapeHtml(str = '') {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function getUser(id) { return state.data.users.find(u => u.id === id); }
function getRequest(id) { return state.data.requests.find(r => r.id === id); }
function me() { return getUser(state.currentUserId); }

function distanceKm(a, b) {
  if (!a || !b) return 0;
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const la1 = a.lat * Math.PI/180, la2 = b.lat * Math.PI/180;
  const x = Math.sin(dLat/2)**2 + Math.cos(la1) * Math.cos(la2) * Math.sin(dLng/2)**2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x)) * 10) / 10;
}

function hoursUntil(dateStr) {
  return (new Date(dateStr) - now()) / 3600000;
}
function urgencyOf(dateStr) {
  const h = hoursUntil(dateStr);
  if (h < 0)   return { key: 'past',     label: 'Past',     color: 'text-blue-300/60', bg: 'bg-white/5', dot: 'bg-blue-300/60' };
  if (h < 4)   return { key: 'critical', label: 'NOW · within ' + Math.max(1, Math.round(h*60)/60) + 'h', color: 'text-urgent', bg: 'bg-urgent/15', dot: 'bg-urgent' };
  if (h < 24)  return { key: 'tonight',  label: h < 12 ? 'Tonight' : 'Within 24h', color: 'text-accent', bg: 'bg-accent/15', dot: 'bg-accent' };
  if (h < 72)  return { key: 'soon',     label: 'Within 3 days', color: 'text-royal-300', bg: 'bg-royal-400/10', dot: 'bg-royal-400' };
  return        { key: 'planned',  label: 'Upcoming', color: 'text-blue-200/70', bg: 'bg-white/5', dot: 'bg-blue-200/70' };
}

function formatWhen(dateStr) {
  const d = new Date(dateStr);
  const diff = (d - now()) / 3600000;
  const today = new Date(); today.setHours(0,0,0,0);
  const day = new Date(d); day.setHours(0,0,0,0);
  const dayDiff = Math.round((day - today) / 86400000);
  const t = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if (diff < 0)   return 'Past · ' + d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' · ' + t;
  if (dayDiff === 0)  return diff < 12 ? `Tonight · ${t}` : `Today · ${t}`;
  if (dayDiff === 1)  return `Tomorrow · ${t}`;
  if (dayDiff < 7)    return `${d.toLocaleDateString([], { weekday: 'long' })} · ${t}`;
  return d.toLocaleDateString([], { month: 'short', day: 'numeric', weekday: 'short' }) + ` · ${t}`;
}

function timeAgo(dateStr) {
  const ms = now() - new Date(dateStr);
  const m = Math.floor(ms / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h`;
  const d = Math.floor(h / 24);
  if (d < 7) return `${d}d`;
  return new Date(dateStr).toLocaleDateString([], { month: 'short', day: 'numeric' });
}

function userRatingSummary(user) {
  const recv = state.data.ratings.filter(r => r.targetId === user.id);
  if (recv.length === 0) return null;
  const skill = recv.filter(r => r.skill != null);
  const sport = recv.filter(r => r.sportsmanship != null);
  const avgS = skill.length ? skill.reduce((a, r) => a + r.skill, 0) / skill.length : null;
  const avgM = sport.length ? sport.reduce((a, r) => a + r.sportsmanship, 0) / sport.length : null;
  return { count: recv.length, skill: avgS, sportsmanship: avgM };
}

function matchScore(user, request) {
  if (!user || !request) return -1;
  if (request.status !== 'open') return -1;
  if (request.managerId === user.id) return -1;
  const us = user.sports.find(s => s.sport === request.sport);
  if (!us) return -1;
  if (us.skill < request.minSkill) return -1;
  // gender filter
  if (request.genderReq === 'men'   && user.gender !== 'male')   return -1;
  if (request.genderReq === 'women' && user.gender !== 'female') return -1;
  // base
  let score = 100;
  score += (us.skill - request.minSkill) * 5;
  const dist = distanceKm(user.location, request.location);
  if (dist > (user.proximityKm || 25)) score -= 40;
  else score += Math.max(0, (user.proximityKm || 25) - dist) * 1.5;
  const h = hoursUntil(request.date);
  if (h > 0 && h < 4)   score += 35;
  else if (h < 24)      score += 18;
  else if (h < 72)      score += 6;
  if (request.payment > 0) score += Math.min(request.payment / 5, 12);
  return Math.round(score);
}

function visibleRequestsForPlayer(userId) {
  const user = getUser(userId);
  return state.data.requests
    .map(r => ({ r, score: matchScore(user, r) }))
    .filter(x => x.score >= 0)
    .sort((a, b) => {
      if (state.sort === 'soonest') return new Date(a.r.date) - new Date(b.r.date);
      if (state.sort === 'pay') return (b.r.payment||0) - (a.r.payment||0);
      return b.score - a.score;
    });
}

function threadMessages(requestId) {
  return state.data.messages
    .filter(m => m.requestId === requestId)
    .sort((a, b) => new Date(a.ts) - new Date(b.ts));
}

function threadsForUser(userId) {
  const userReqIds = new Set();
  state.data.requests.forEach(r => {
    if (r.managerId === userId && r.claimedBy) userReqIds.add(r.id);
    if (r.claimedBy === userId) userReqIds.add(r.id);
  });
  return [...userReqIds]
    .map(id => {
      const req = getRequest(id);
      const msgs = threadMessages(id);
      const last = msgs[msgs.length - 1];
      const other = req.managerId === userId ? getUser(req.claimedBy) : getUser(req.managerId);
      return { request: req, lastMessage: last, other, msgs };
    })
    .filter(t => t.other)
    .sort((a, b) => {
      const at = a.lastMessage ? new Date(a.lastMessage.ts) : new Date(a.request.createdAt || 0);
      const bt = b.lastMessage ? new Date(b.lastMessage.ts) : new Date(b.request.createdAt || 0);
      return bt - at;
    });
}

function canPlayerSeeRating(rating, viewerId) {
  // viewer can ALWAYS see ratings they themselves authored
  if (rating.fromId === viewerId) return true;
  // viewer is the target — they can see this rating only if they have rated the same request
  if (rating.targetId === viewerId) {
    return state.data.ratings.some(r => r.requestId === rating.requestId && r.fromId === viewerId);
  }
  // viewer is third party — can see if BOTH parties have rated (or if it's been > 14 days)
  const bothRated = state.data.ratings.filter(r => r.requestId === rating.requestId).length >= 2;
  const old = (now() - new Date(rating.createdAt)) > 14 * 86400000;
  return bothRated || old;
}

function pendingRatings(userId) {
  // requests where the user participated, game is past, and the user has not yet rated
  const out = [];
  state.data.requests.forEach(r => {
    if (r.status !== 'completed' && r.status !== 'claimed') return;
    if (new Date(r.date) > now()) return; // game must be past
    const participants = [r.managerId, r.claimedBy].filter(Boolean);
    if (!participants.includes(userId)) return;
    const otherId = participants.find(p => p !== userId);
    if (!otherId) return;
    const already = state.data.ratings.find(rt => rt.requestId === r.id && rt.fromId === userId);
    if (!already) out.push({ request: r, otherId });
  });
  return out;
}

function toast(text, kind='info') {
  const wrap = $('#toasts');
  const el = document.createElement('div');
  const color = kind === 'success' ? 'bg-live/95 text-royal-950' :
                kind === 'error'   ? 'bg-urgent text-white'      :
                                     'bg-royal-700/95 text-white border border-royal-400/40';
  el.className = `toast pointer-events-auto px-4 py-2.5 rounded-full text-sm font-semibold shadow-lg ${color}`;
  el.textContent = text;
  wrap.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .3s';
    el.style.opacity = 0;
    setTimeout(() => el.remove(), 350);
  }, 2200);
}

// ------------------------------------------------------------
// Init
// ------------------------------------------------------------
function init() {
  const persisted = loadData();
  state.data = (persisted && persisted.users && persisted.users.length) ? persisted : seedData();
  saveData();
  render();
  bindEvents();
}

// ------------------------------------------------------------
// Renderers
// ------------------------------------------------------------
function render() {
  $('#app').innerHTML = renderTopBar() + renderScreen();
  $('#bottom-nav').innerHTML = renderBottomNav();
  // scroll to top on screen change
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function renderTopBar() {
  const u = me();
  return `
  <header class="sticky top-0 z-40 px-5 pt-5 pb-3 bg-gradient-to-b from-royal-950/95 via-royal-950/90 to-royal-950/0 backdrop-blur-md">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-royal-400 to-royal-700 flex items-center justify-center shadow-lg">
          <svg viewBox="0 0 24 24" class="w-5 h-5 text-white" fill="currentColor"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>
        </div>
        <div class="leading-none">
          <div class="text-[10px] tracking-[0.25em] font-bold text-royal-300/80">FREE</div>
          <div class="text-sm font-black tracking-tight -mt-0.5">AGENT</div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button data-action="open-screen" data-screen="profile"
                class="w-9 h-9 rounded-full overflow-hidden ring-2 ring-royal-400/30 tap flex items-center justify-center font-bold text-sm"
                style="background: linear-gradient(135deg, ${u.color}, ${u.color}66);">
          ${u.initials}
        </button>
      </div>
    </div>
    ${renderViewSwitch()}
  </header>
  `;
}

function renderViewSwitch() {
  const isPlayer = state.view === 'player';
  return `
  <div class="mt-3">
    <div class="relative switch-track h-11 rounded-full p-1 grid grid-cols-2 select-none">
      <div class="switch-knob ${isPlayer ? '' : 'right'}"></div>
      <button data-action="switch-view" data-view="player"
              class="relative z-10 rounded-full text-sm font-bold flex items-center justify-center gap-1.5 ${isPlayer ? 'text-white' : 'text-royal-300/70'}">
        <span>🏃</span> PLAY
      </button>
      <button data-action="switch-view" data-view="manager"
              class="relative z-10 rounded-full text-sm font-bold flex items-center justify-center gap-1.5 ${!isPlayer ? 'text-white' : 'text-royal-300/70'}">
        <span>📋</span> MANAGE
      </button>
    </div>
  </div>
  `;
}

function renderBottomNav() {
  const navItems = state.view === 'player'
    ? [
        { id: 'discover', label: 'Discover', icon: iconSearch },
        { id: 'messages', label: 'Messages', icon: iconChat },
        { id: 'profile',  label: 'Profile',  icon: iconUser  },
      ]
    : [
        { id: 'manager-home', label: 'My Games', icon: iconList   },
        { id: 'new-request',  label: 'Post',     icon: iconPlus,  primary: true },
        { id: 'messages',     label: 'Messages', icon: iconChat   },
        { id: 'profile',      label: 'Profile',  icon: iconUser   },
      ];
  // unread badge for messages
  const threads = threadsForUser(state.currentUserId);
  const unread = threads.filter(t => t.lastMessage && t.lastMessage.fromId !== state.currentUserId).length;
  return `
  <div class="glass-strong rounded-2xl px-2 py-2 flex items-stretch justify-around shadow-card">
    ${navItems.map(item => {
      const active = state.screen === item.id || (item.id === 'manager-home' && state.screen === 'request-detail' && state.view === 'manager');
      const isMsg = item.id === 'messages';
      return `
        <button data-action="open-screen" data-screen="${item.id}"
                class="relative flex-1 flex flex-col items-center justify-center gap-0.5 py-1.5 rounded-xl tap
                       ${item.primary ? 'mx-1' : ''}">
          <div class="${item.primary
                    ? 'w-11 h-11 -mt-3 rounded-2xl bg-gradient-to-br from-royal-400 to-royal-600 shadow-lg flex items-center justify-center'
                    : (active ? 'text-white' : 'text-royal-300/60')} relative">
            ${item.icon(item.primary ? 'w-6 h-6 text-white' : 'w-5 h-5')}
            ${isMsg && unread ? `<span class="absolute -top-1 -right-1.5 min-w-[18px] h-[18px] px-1 rounded-full bg-urgent text-white text-[10px] font-bold flex items-center justify-center">${unread}</span>` : ''}
          </div>
          <span class="text-[10px] font-semibold ${active ? 'text-white' : 'text-royal-300/60'} ${item.primary ? 'mt-1' : ''}">${item.label}</span>
        </button>
      `;
    }).join('')}
  </div>
  `;
}

function renderScreen() {
  const s = state.screen;
  if (state.view === 'player') {
    if (s === 'discover')        return renderDiscover();
    if (s === 'request-detail')  return renderPlayerRequestDetail();
    if (s === 'messages')        return renderMessagesList();
    if (s === 'thread')          return renderThread();
    if (s === 'profile')         return renderProfile();
    return renderDiscover();
  } else {
    if (s === 'manager-home')    return renderManagerHome();
    if (s === 'new-request')     return renderNewRequest();
    if (s === 'request-detail')  return renderManagerRequestDetail();
    if (s === 'messages')        return renderMessagesList();
    if (s === 'thread')          return renderThread();
    if (s === 'profile')         return renderProfile();
    return renderManagerHome();
  }
}

// ---------- Discover (Player) ----------
function renderDiscover() {
  const u = me();
  const matches = visibleRequestsForPlayer(u.id);
  const filtered = state.filterSport === 'all'
    ? matches
    : matches.filter(m => m.r.sport === state.filterSport);
  const pending = pendingRatings(u.id);

  return `
  <main class="px-5 pt-2 animate-fade-in">
    <div class="mb-4">
      <h1 class="text-2xl font-black tracking-tight">Hey ${u.name.split(' ')[0]} 👋</h1>
      <p class="text-sm text-royal-300/80 mt-0.5">${filtered.length} game${filtered.length===1?'':'s'} near ${u.location.label.split(',')[0]}</p>
    </div>

    ${pending.length ? `
      <div class="mb-4 glass rounded-2xl p-4 flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-accent/15 text-accent flex items-center justify-center text-lg">⭐</div>
        <div class="flex-1">
          <div class="text-sm font-bold">Rate your last game</div>
          <div class="text-xs text-royal-300/70">${pending.length} game${pending.length>1?'s':''} waiting for your review</div>
        </div>
        <button data-action="open-screen" data-screen="profile"
                class="text-xs font-bold text-accent tap">REVIEW →</button>
      </div>
    ` : ''}

    <!-- Filters -->
    <div class="flex items-center gap-2 overflow-x-auto -mx-5 px-5 pb-3 scroll-area">
      ${renderFilterChip('all','All','')}
      ${SPORTS.map(s => renderFilterChip(s.id, s.name, s.emoji)).join('')}
    </div>

    <!-- Sort row -->
    <div class="flex items-center justify-between mb-3">
      <div class="text-xs uppercase tracking-wider text-royal-300/60 font-bold">${filtered.length} open</div>
      <div class="flex items-center gap-1 text-xs">
        ${['match','soonest','pay'].map(s => `
          <button data-action="set-sort" data-sort="${s}"
                  class="px-2.5 py-1 rounded-full font-semibold ${state.sort===s ? 'chip-on' : 'chip text-royal-300/80'}">
            ${s === 'match' ? 'Best match' : s === 'soonest' ? 'Soonest' : 'Highest pay'}
          </button>
        `).join('')}
      </div>
    </div>

    <!-- Cards -->
    <div class="flex flex-col gap-3">
      ${filtered.length === 0
        ? renderEmpty('No matching games', 'Try a different sport filter or widen your distance preference.')
        : filtered.map(({ r, score }) => renderRequestCard(r, { showMatchBadge: state.sort === 'match', score })).join('')
      }
    </div>

    ${renderDisclaimerCard()}
  </main>
  `;
}

function renderFilterChip(id, label, emoji) {
  const on = state.filterSport === id;
  return `
  <button data-action="set-filter" data-sport="${id}"
          class="shrink-0 px-3.5 py-1.5 rounded-full text-sm font-semibold whitespace-nowrap tap ${on ? 'chip-on' : 'chip text-royal-300/80'}">
    ${emoji ? `<span class="mr-1">${emoji}</span>` : ''}${label}
  </button>
  `;
}

function renderRequestCard(r, opts={}) {
  const sport = SPORT_MAP[r.sport];
  const u  = me();
  const mgr = getUser(r.managerId);
  const dist = distanceKm(u.location, r.location);
  const urg = urgencyOf(r.date);
  const summary = userRatingSummary(mgr);
  const isCritical = urg.key === 'critical';
  const isHot = urg.key === 'critical' || urg.key === 'tonight';

  return `
  <button data-action="open-request" data-request-id="${r.id}"
          class="text-left w-full glass rounded-2xl p-4 tap relative overflow-hidden
                 ${isCritical ? 'shadow-glow-urgent border-urgent/40' : (urg.key === 'tonight' ? 'shadow-glow-gold border-accent/30' : '')}">
    ${isCritical ? `<div class="absolute -top-px -right-px w-2 h-2 m-3 rounded-full bg-urgent animate-pulse-soft"></div>` : ''}

    <div class="flex items-start gap-3">
      <div class="w-14 h-14 rounded-2xl sport-tile flex items-center justify-center text-3xl border border-royal-400/20 shrink-0">
        ${sport.emoji}
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center justify-between gap-2">
          <div class="font-bold text-[15px] truncate">${sport.name} · ${r.format}</div>
          <div class="text-[10px] font-bold uppercase tracking-wider ${urg.color} ${urg.bg} px-2 py-0.5 rounded-full whitespace-nowrap">
            ${urg.label}
          </div>
        </div>
        <div class="text-[13px] text-royal-200/90 mt-0.5 font-semibold">${formatWhen(r.date)}</div>
        <div class="flex items-center gap-1.5 text-xs text-royal-300/70 mt-1">
          ${iconPin('w-3.5 h-3.5')} <span class="truncate">${r.location.label}</span>
          <span class="text-royal-400/40">·</span>
          <span>${dist} km</span>
        </div>
      </div>
    </div>

    <div class="mt-3 pt-3 border-t border-royal-400/10 flex items-center justify-between">
      <div class="flex items-center gap-2 min-w-0">
        <div class="w-7 h-7 rounded-full flex items-center justify-center text-[11px] font-bold shrink-0"
             style="background: linear-gradient(135deg, ${mgr.color}, ${mgr.color}88);">${mgr.initials}</div>
        <div class="min-w-0">
          <div class="text-xs font-semibold truncate">${mgr.name}</div>

      </div>
      <div class="flex items-center gap-1.5">

  </button>

function renderDisclaimerCard() {
  return `
  <div class="mt-5 mb-2 flex items-start gap-2 text-[11px] text-royal-300/60 px-2">

// ---------- Request detail (Player) ----------

  const r = getRequest(state.params.requestId);

  const mgr = getUser(r.managerId);
  const u   = me();
  const dist = distanceKm(u.location, r.location);
  const urg = urgencyOf(r.date);
  const mgrSummary = userRatingSummary(mgr);
  const claimedByMe = r.claimedBy === u.id;
  const claimed = !!r.claimedBy;

  const isOpen = r.status === 'open';

  return `
  <main class="animate-fade-in">
    <div class="px-5 pt-2">
      <button data-action="go-back" class="text-royal-300/70 text-sm font-semibold flex items-center gap-1 tap">${iconBack('w-4 h-4')} Back</button>

            <div class="px-2.5 py-1 rounded-full bg-royal-950/70 backdrop-blur font-semibold truncate">${r.location.label}</div>

function renderManagerCard(r) {
  const sport = SPORT_MAP[r.sport];
  const urg = urgencyOf(r.date);
  const claimer = r.claimedBy ? getUser(r.claimedBy) : null;
  const past = new Date(r.date) < now();

    r.status === 'open'      ? `<div class="text-[10px] font-bold uppercase tracking-wider text-accent bg-accent/10 px-2 py-0.5 rounded-full">Waiting</div>` :
    r.status === 'claimed'   ? `<div class="text-[10px] font-bold uppercase tracking-wider text-live bg-live/10 px-2 py-0.5 rounded-full">Claimed</div>` :
                               `<div class="text-[10px] font-bold uppercase tracking-wider text-royal-300/70 bg-white/5 px-2 py-0.5 rounded-full">Past</div>`;

  // pending rating
  const u = me();
  const alreadyRated = state.data.ratings.some(rt => rt.requestId === r.id && rt.fromId === u.id);
  const needsRating = past && claimer && !alreadyRated;

  return `

          class="text-left w-full glass rounded-2xl p-4 tap relative">
    <div class="flex items-start gap-3">

          <div class="font-bold text-[15px] truncate">${sport.name} · ${r.format}</div>
          ${statusPill}
        </div>
        <div class="text-[13px] text-royal-200/90 mt-0.5 font-semibold">${formatWhen(r.date)}</div>
        <div class="flex items-center gap-1.5 text-xs text-royal-300/70 mt-1">
          ${iconPin('w-3.5 h-3.5')} <span class="truncate">${r.location.label}</span>
        </div>
      </div>
    </div>
    ${claimer ? `
      <div class="mt-3 pt-3 border-t border-royal-400/10 flex items-center gap-2">
        <div class="w-7 h-7 rounded-full flex items-center justify-center text-[11px] font-bold"
             style="background: linear-gradient(135deg, ${claimer.color}, ${claimer.color}88);">${claimer.initials}</div>

          <span class="text-royal-300/70">Claimed by</span> <span class="font-bold">${claimer.name}</span>

        ${needsRating ? `<div class="ml-auto text-[10px] font-bold uppercase tracking-wider text-accent">Needs rating →</div>` : ''}

    ${r.status === 'open' && !past && urg.key !== 'planned' ? `
      <div class="mt-3 pt-3 border-t border-royal-400/10 text-xs">
        <span class="${urg.color} font-bold">${urg.label}</span>
        <span class="text-royal-300/60"> · qualifying players notified</span>
      </div>` : ''}

  `;
}

function renderStarsSmall(n, ofFive=false) {
  const v = Number(n) || 0;
  let html = '<span class="inline-flex items-center gap-px">';
  for (let i = 1; i <= 5; i++) {
    html += iconStarSolid(`w-3 h-3 ${v >= i ? 'text-accent' : 'text-royal-400/30'} inline`);
  }
  html += '</span>';
  return ofFive ? html : html;
}
function renderStarsTiny(n) {
  const v = Number(n) || 0;
  let html = '';
  for (let i = 1; i <= 5; i++) {
    html += `<span class="${v >= i ? 'text-accent' : 'text-royal-400/30'}">★</span>`;
  }
  return html;
}

// ------------------------------------------------------------
// Actions
// ------------------------------------------------------------
const actions = {
  'switch-view': (ds) => {
    state.view = ds.view;
    state.screen = ds.view === 'player' ? 'discover' : 'manager-home';
    render();
  },
  'open-screen': (ds) => {
    if (ds.screen === 'new-request') state.draftRequest = makeDraftRequest();
    state.screen = ds.screen;
    state.params = {};
    render();
  },
  'set-filter': (ds) => { state.filterSport = ds.sport; render(); },
  'set-sort':   (ds) => { state.sort = ds.sort; render(); },
  'open-request': (ds) => {
    state.params = { requestId: ds.requestId };
    state.screen = 'request-detail';
    render();
  },
  'go-back': () => {
    if (state.screen === 'thread') {
      state.screen = 'messages';
    } else if (state.screen === 'new-request') {
      state.screen = 'manager-home';
    } else {
      state.screen = state.view === 'player' ? 'discover' : 'manager-home';
    }
    state.params = {};
    render();
  },
  'claim-request': (ds) => {
    const r = getRequest(ds.requestId);
    if (!r || r.status !== 'open') return;
    r.status = 'claimed';
    r.claimedBy = state.currentUserId;
    // create opener message
    const me = getUser(state.currentUserId);
    const mgr = getUser(r.managerId);
    state.data.messages.push({
      id: uid('m'),
      requestId: r.id,
      fromId: me.id,
      text: `Hey! Just claimed your ${SPORT_MAP[r.sport].name} game — what time should I get there?`,
      ts: new Date().toISOString(),
    });
    saveData();
    toast(`You claimed ${mgr.name.split(' ')[0]}'s game — opening chat…`, 'success');
    state.params = { requestId: r.id };
    state.screen = 'thread';
    render();
    // simulate manager reply
    setTimeout(() => simulateReply(r.id), 1300 + Math.random() * 800);
  },
  'cancel-claim': (ds) => {
    const r = getRequest(ds.requestId);
    if (!r || r.claimedBy !== state.currentUserId) return;
    r.status = 'open';
    r.claimedBy = null;
    saveData();
    toast('Claim cancelled');
    state.screen = 'discover';
    state.view = 'player';
    render();
  },
  'open-thread': (ds) => {
    state.params = { requestId: ds.requestId };
    state.screen = 'thread';
    render();
    requestAnimationFrame(() => {
      const sc = document.getElementById('thread-scroll');
      if (sc) sc.scrollTop = sc.scrollHeight;
    });
  },
  'send-message': (ds, e) => {
    e.preventDefault();
    const form = e.target.closest('form');
    const input = form.querySelector('input[name="text"]');
    const text = input.value.trim();
    if (!text) return;
    state.data.messages.push({
      id: uid('m'),
      requestId: ds.requestId,
      fromId: state.currentUserId,
      text,
      ts: new Date().toISOString(),
    });
    input.value = '';
    saveData();
    render();
    requestAnimationFrame(() => {
      const sc = document.getElementById('thread-scroll');
      if (sc) sc.scrollTop = sc.scrollHeight;
    });
    // simulate a reply
    setTimeout(() => simulateReply(ds.requestId), 1500 + Math.random() * 1200);
  },
  // ---- new request form ----
  'draft-set': (ds) => {
    const key = ds.key, val = isFinite(+ds.value) && ds.key !== 'sport' && ds.key !== 'format' && ds.key !== 'genderReq' ? +ds.value : ds.value;
    state.draftRequest[key] = val;
    if (key === 'sport') state.draftRequest.format = SPORT_MAP[val].formats[0];
    render();
  },
  'draft-input': (ds, e) => {
    const t = e.target;
    state.draftRequest[ds.key] = t.type === 'number' ? +t.value : t.value;
  },
  'draft-set-when': (ds) => {
    const d = new Date();
    if (ds.when === 'tonight') { d.setHours(20,0,0,0); if (d < new Date()) d.setDate(d.getDate()+1); }
    if (ds.when === 'tomorrow') { d.setDate(d.getDate()+1); d.setHours(19,0,0,0); }
    if (ds.when === 'weekend') {
      const day = d.getDay();
      const diff = (6 - day + 7) % 7 || 7; // next Saturday
      d.setDate(d.getDate() + diff); d.setHours(11,0,0,0);
    }
    state.draftRequest.date = toLocalInput(d);
    render();
  },
  'draft-set-loc': (ds) => {
    state.draftRequest.locKey = ds.loc;
    state.draftRequest.locLabel = LOC[ds.loc].label;
    render();
  },
  'submit-request': () => {
    const d = state.draftRequest;
    if (!d.sport)   return toast('Pick a sport',   'error');
    if (!d.format)  return toast('Pick a format',  'error');
    if (!d.date)    return toast('Set a date/time','error');
    if (!d.locLabel)return toast('Enter a location','error');
    if (!d.minSkill)return toast('Set a min skill','error');
    const loc = d.locKey ? LOC[d.locKey] : { label: d.locLabel, lat: 40.7081 + (Math.random()-.5)*0.04, lng: -73.9571 + (Math.random()-.5)*0.04 };
    const req = {
      id: uid('r'),
      managerId: state.currentUserId,
      sport: d.sport, format: d.format,
      date: new Date(d.date).toISOString(),
      location: { label: d.locLabel, lat: loc.lat, lng: loc.lng },
      genderReq: d.genderReq || 'open',
      minSkill: d.minSkill,
      payment: +d.payment || 0,
      notes: d.notes || '',
      status: 'open', claimedBy: null,
      createdAt: new Date().toISOString(),
    };
    state.data.requests.unshift(req);
    saveData();
    toast('Game posted — players notified', 'success');
    state.draftRequest = null;
    state.screen = 'manager-home';
    render();
  },
  'delete-request': (ds) => {
    if (!confirm('Delete this request?')) return;
    state.data.requests = state.data.requests.filter(r => r.id !== ds.requestId);
    saveData();
    toast('Request deleted');
    state.screen = 'manager-home';
    render();
  },
  // ---- profile ----
  'set-sport-skill': (ds) => {
    const u = me();
    const s = u.sports.find(x => x.sport === ds.sport);
    if (s) s.skill = +ds.skill;
    saveData(); render();
  },
  'remove-sport': (ds) => {
    const u = me();
    u.sports = u.sports.filter(x => x.sport !== ds.sport);
    saveData(); render();
  },
  'add-sport': (ds) => {
    const u = me();
    if (!u.sports.find(s => s.sport === ds.sport))
      u.sports.push({ sport: ds.sport, skill: 3 });
    saveData(); render();
  },
  'set-proximity': (_, e) => {
    const u = me();
    u.proximityKm = +e.target.value;
    const disp = document.querySelector('[data-proximity-display]');
    if (disp) disp.textContent = u.proximityKm + ' km';
    clearTimeout(actions._pxTimer);
    actions._pxTimer = setTimeout(() => { saveData(); render(); }, 250);
  },
  // ---- rating ----
  'rate-prompt': (ds) => {
    state.draftRating = {
      requestId: ds.requestId,
      skill: 0, sportsmanship: 0,
      publicNote: '', privateNote: '',
    };
    renderOverlay();
  },
  'close-rating': () => { state.draftRating = null; renderOverlay(); },
  'rating-set': (ds) => {
    state.draftRating[ds.key] = +ds.value;
    renderOverlay();
  },
  'rating-input': (ds, e) => {
    state.draftRating[ds.key] = e.target.value;
  },
  'submit-rating': () => {
    const d = state.draftRating;
    if (!d) return;
    const r = getRequest(d.requestId);
    if (!r) return;
    const u = me();
    const isManager = r.managerId === u.id;
    if (!d.sportsmanship)   return toast('Rate sportsmanship', 'error');
    if (isManager && !d.skill) return toast('Rate skill', 'error');
    const otherId = isManager ? r.claimedBy : r.managerId;
    state.data.ratings.push({
      id: uid('rt'),
      requestId: r.id,
      fromId: u.id,
      targetId: otherId,
      role: isManager ? 'manager-rating-player' : 'player-rating-manager',
      skill: isManager ? d.skill : null,
      sportsmanship: d.sportsmanship,
      publicNote: d.publicNote || '',
      privateNote: d.privateNote || '',
      createdAt: new Date().toISOString(),
    });
    r.status = 'completed';
    saveData();
    state.draftRating = null;
    toast('Rating submitted', 'success');
    renderOverlay();
    render();
  },
};

function makeDraftRequest() {
  return {
    sport: '', format: '', date: '', locKey: '', locLabel: '',
    genderReq: 'open', minSkill: 3, payment: 0, notes: '',
  };
}

function toLocalInput(d) {
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// ------------------------------------------------------------
// Overlay (rating modal)
// ------------------------------------------------------------
function renderOverlay() {
  $('#overlays').innerHTML = state.draftRating ? renderRatingModal() : '';
}

// ------------------------------------------------------------
// Simulated replies
// ------------------------------------------------------------
const REPLY_BANK_MANAGER = [
  "Awesome — see you there. Doors open 15 min before.",
  "Perfect, you're set. Bring a dark jersey if you've got one.",
  "Glad to have you! I'll text the rest of the group.",
  "Sweet, my number's on the booking confirmation — pls text if you get held up.",
  "Right on — locker room is to the left when you walk in.",
];
const REPLY_BANK_PLAYER = [
  "Sounds good — I'll be there!",
  "Cool, en route.",
  "Locked in. Thanks for the call up 🤝",
  "Sweet, ty — heading over now.",
];

function simulateReply(requestId) {
  const r = getRequest(requestId);
  if (!r) return;
  const u = me();
  const otherId = r.managerId === u.id ? r.claimedBy : r.managerId;
  if (!otherId) return;
  const bank = otherId === r.managerId ? REPLY_BANK_MANAGER : REPLY_BANK_PLAYER;
  const text = bank[Math.floor(Math.random() * bank.length)];
  state.data.messages.push({
    id: uid('m'),
    requestId: r.id,
    fromId: otherId,
    text,
    ts: new Date().toISOString(),
  });
  saveData();
  // only re-render if user is on relevant screen
  if (state.screen === 'thread' && state.params.requestId === r.id) {
    render();
    requestAnimationFrame(() => {
      const sc = document.getElementById('thread-scroll');
      if (sc) sc.scrollTop = sc.scrollHeight;
    });
  } else if (state.screen === 'messages') {
    render();
  } else {
    // update bottom nav for unread badge
    $('#bottom-nav').innerHTML = renderBottomNav();
  }
}

// ------------------------------------------------------------
// Event binding
// ------------------------------------------------------------
function bindEvents() {
  document.addEventListener('click', (e) => {
    const target = e.target.closest('[data-action]');
    if (!target) return;
    // Form-level actions are handled by the submit listener
    if (target.tagName === 'FORM') return;
    const action = target.dataset.action;
    if (actions[action]) actions[action](target.dataset, e);
  });
  document.addEventListener('submit', (e) => {
    const target = e.target.closest('[data-action]');
    if (!target) return;
    const action = target.dataset.action;
    if (actions[action]) actions[action](target.dataset, e);
  });
  document.addEventListener('input', (e) => {
    const target = e.target.closest('[data-action]');
    if (!target) return;
    const action = target.dataset.action;
    if (action === 'draft-input' || action === 'set-proximity' || action === 'rating-input') {
      actions[action](target.dataset, e);
    }
  });
  document.addEventListener('change', (e) => {
    const target = e.target.closest('[data-action]');
    if (!target) return;
    const action = target.dataset.action;
    if (action === 'draft-input') {
      actions[action](target.dataset, e);
    }
  });
}

// ------------------------------------------------------------
// Go
// ------------------------------------------------------------
init();
</script>
